dependencies:
  espressif/cmake_utilities:
    version: "^1"
    rules: # will add "optional_component" only when all if clauses are True
      - if: "idf_version >=5.0"
      - if: "target in [esp32c2]"
  esp_bsp_devkit:
    version: "^3.0.3"
  espressif/led_indicator:
    version: "2.0.2"
  espressif/led_strip:
    version: "^3"
  espressif/esp_aliro_lib:
    version: "^1.2.0"
  m5nfc:
    git: https://github.com/espressif/esp-aliro.git
    path: examples/aliro_reader/components/m5nfc
    version: db6bc8ea93854b730b9163d2472dfa7bff86a280
    rules:
      - if: "target in [esp32, esp32s3, esp32c3, esp32c6, esp32h2, esp32p4]"
