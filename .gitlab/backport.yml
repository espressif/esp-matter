# Manual job to create backport MRs for a merged MR.
#
# Usage:
#   1. Merge the MR and add "needs backport vX.Y" label(s) to it.
#   2. Open the merged MR's pipeline and press play on `create_backports`.
#      (Only merged MRs are backported — the script refuses otherwise.
#      The MR pipeline stays playable after merge.)

create_backports:
    stage: pre_check
    image: python:3.12-alpine
    needs: []
    tags: [build]
    rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: manual
          allow_failure: true
        - if: '$CI_PIPELINE_SOURCE == "web" && $BACKPORT_MR_IID'
    variables:
        GIT_STRATEGY: clone
        GIT_DEPTH: 0
        GIT_SUBMODULE_STRATEGY: none
        GITLAB_TOKEN: $GITLAB_MR_COMMENT_TOKEN
    before_script:
        - apk add --no-cache git
        - git config --global user.name "esp-matter-bot"
        - git config --global user.email "esp-matter-bot@espressif.com"
    script:
        - ./tools/ci/backport.py "${BACKPORT_MR_IID:-$CI_MERGE_REQUEST_IID}"
